name: AegisOS Game CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-tests:
    name: Game engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run game engine tests
        run: npm run test:game

  windows-package:
    name: Windows desktop package
    needs: game-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: aegisos-windows-installer
          path: dist/*.exe
          if-no-files-found: error
