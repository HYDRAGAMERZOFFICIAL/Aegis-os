name: AegisOS Cloud Game Checks

on:
  push:
    branches:
      - feature/vercel-cloud-game-platform
  pull_request:
    branches:
      - main

jobs:
  game-and-cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate JavaScript syntax
        run: npm run check:game
      - name: Run campaign, account and save tests
        run: npm run test:game
      - name: Validate Vercel configuration
        run: node -e "JSON.parse(require('node:fs').readFileSync('vercel.json', 'utf8'))"
      - name: Verify Vercel static game assets match the local simulator
        run: |
          cmp simulator/web/game.html public/game.html
          cmp simulator/web/game.css public/game.css
          cmp simulator/web/auth.js public/auth.js
          cmp simulator/web/game.js public/game.js
