# Limine Bootloader Configuration for AegisOS
timeout: 3
default_entry: 1

/AegisOS (Kernel v2.0-Alpha - Higher-Half x86-64)
    protocol: limine
    kernel_path: boot():/boot/vmlinuz-aegis
    resolution: 1280x800x32
    cmdline: aegis.mode=secure aegis.theme=quantum-cyan aegis.aslr=1

/AegisOS Safe Mode (Single User / Minimal Drivers)
    protocol: limine
    kernel_path: boot():/boot/vmlinuz-aegis
    resolution: 1024x768x32
    cmdline: aegis.mode=safe aegis.debug=1

